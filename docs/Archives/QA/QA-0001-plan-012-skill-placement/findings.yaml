  - id: QA-0001-F02
    title: "Skillパッケージの正本ファイル集合と生成物除外規則が再現不能"
    category: evidence-gap
    severity: medium
    severity_rationale: "計画書22行目は提供元を56ファイルと記録しているが、実体にはテスト実行で生成される.pytest_cacheと__pycache__が混入し得る。生成物を除いた正本ファイル数は55でMANIFEST.txtの55エントリと一致するため、56という数値は正本の受入基準として再現できない。"
    status: fixed-and-verified
    first_seen_cycle: 1
    claim_refs: [CLAIM-001]
    requirement_refs: [PLAN-012-PACKAGE-INTEGRITY]
    evidence:
      - type: code
        reference: "docs/Artifacts/implementation_plan_012_0819.md:22,31,58-59,89-90"
        revision: "f972be01b052275fc4e2103ca32be6233b6e2a5e0bfd56e0eea2a7f0c3e54b8c"
      - type: static-analysis
        reference: "提供元の生成物除外後ファイル数=55、MANIFEST.txtエントリ数=55、生成物にはscripts/__pycache__と.pytest_cacheが存在"
        revision: "WORKTREE@bc05359"
    limitations:
      - "実際の配置後にファイルモードやシンボリックリンクを比較する検証は未実施。"
    requested_action: "正本集合をMANIFEST.txtに定義し、__pycache__、.pytest_cache、*.pyc、OS固有ファイル等の除外規則と、配置前後の比較コマンド・期待件数を計画へ明記する。"
    fingerprint:
      category: evidence-gap
      requirement_id: PLAN-012-PACKAGE-INTEGRITY
      primary_path: ".agents/skills/spec-driven-qa-review/MANIFEST.txt"
      semantic_key: "canonical-package-count-not-reproducible"
    author_response:
      disposition: accepted
      response: "MANIFEST.txtを正本ファイル集合の基準とし、生成物を除いた55件の配置前後比較と除外規則を計画へ明記する。"
      responded_at: "2026-08-19T23:18:00+09:00"
    verification:
