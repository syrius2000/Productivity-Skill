  - id: QA-0001-F03
    title: "改善前後の評価に合否基準と成果物契約がない"
    category: coverage-gap
    severity: medium
    severity_rationale: "計画書65〜70行目と83〜84行目は2〜3シナリオの再実行と問題・残余リスクの記録を求めるが、各シナリオの期待出力、Assertion、判定方法、保存先、旧版との比較指標を定義していない。改善が有効だったかを再現可能に判定できない。"
    status: fixed-and-verified
    first_seen_cycle: 1
    claim_refs: [CLAIM-003]
    requirement_refs: [PLAN-012-IMPROVEMENT-EVALUATION]
    evidence:
      - type: code
        reference: "docs/Artifacts/implementation_plan_012_0819.md:42-50,61-70,79-85"
        revision: "f972be01b052275fc4e2103ca32be6233b6e2a5e0bfd56e0eea2a7f0c3e54b8c"
