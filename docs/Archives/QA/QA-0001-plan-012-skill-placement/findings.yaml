        reference: "skill-creatorの評価手順: evals/evals.json、with-skill/old-skill比較、assertions、benchmark、viewer"
        revision: "~/.agents/skills/skill-creator/SKILL.md"
    limitations:
      - "評価手段を定性的な人間レビュー中心にする設計を排除するFindingではない。定性的評価を採用する場合も、入力・観察項目・判定記録が必要である。"
    requested_action: "各評価シナリオに入力、期待動作、必須証拠、Assertionまたは定性的判定基準、旧版比較、保存先を定義し、実行できない項目はnot-assessableとして扱う。"
